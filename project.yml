name: Statemono

options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Single source of truth for IDs. Later: share extension $(APP_BUNDLE_ID).share,
    # App Group group.$(APP_BUNDLE_ID), iCloud container iCloud.$(APP_BUNDLE_ID).
    APP_BUNDLE_ID: com.statemono
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  StatemonoKit:
    path: Packages/StatemonoKit

targets:
  Statemono-iOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: StatemonoKit
    settings:
      base:
        PRODUCT_NAME: Statemono
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Statemono
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme: {}

  Statemono-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: StatemonoKit
    settings:
      base:
        PRODUCT_NAME: Statemono
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Statemono
        # "Sign to Run Locally" until DEVELOPMENT_TEAM is set.
        CODE_SIGN_IDENTITY: "-"
    scheme: {}
