name: Statemono

options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Single source of truth for IDs. Later: share extension $(APP_BUNDLE_ID).share,
    # App Group group.$(APP_BUNDLE_ID), iCloud container iCloud.$(APP_BUNDLE_ID).
    APP_BUNDLE_ID: com.statemono
    # Pyhash LLC, the paid team. The free personal team can't use TestFlight or App Groups.
    DEVELOPMENT_TEAM: 8G6DC3A5B8
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "3"

packages:
  StatemonoKit:
    path: Packages/StatemonoKit

targets:
  Statemono-iOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: StatemonoKit
    settings:
      base:
        PRODUCT_NAME: Statemono
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Statemono
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The app only uses standard HTTPS, which is exempt, so App Store Connect skips the export compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme: {}

  Statemono-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: StatemonoKit
    # The Mac App Store and TestFlight only take sandboxed apps. Link previews need outgoing connections.
    # Sandboxed, the app's files live in ~/Library/Containers/$(APP_BUNDLE_ID).
    entitlements:
      path: Config/Statemono-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Statemono
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Statemono
        # App Store Connect rejects Mac builds without a category.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Standard HTTPS only, as on iOS, so there's no export compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme: {}
